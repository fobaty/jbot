[package]
name = "pico-bridge"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
embassy-rp = { version = "0.4", features = ["time-driver", "rp235xa"] }
embassy-time = { version = "0.4", features = ["defmt"] }
embassy-sync = "0.4"
defmt = "0.3"
defmt-rtt = "0.4"
heapless = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
