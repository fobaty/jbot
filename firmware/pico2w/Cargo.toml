[package]
name = "pico-bridge"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
jbot_pico_core = { path = "../pico_core" }

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.4", features = [
    "binary-info",
    "critical-section-impl",
    "defmt",
    "rp235xa",
    "time-driver",
] }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures = "0.1"
embassy-sync = { version = "0.6", features = ["defmt"] }

embedded-io-async = "0.6"
static_cell = "2"

embassy-usb = { version = "0.3", default-features = false }

cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
panic = "abort"
