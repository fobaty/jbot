[package]
name = "jbot_analysis"
version = "0.1.0"
edition = "2021"
authors = ["Chief Robotics Architect"]
description = "Offline analysis of recorded JBOT console sessions (telemetry and actions CSV)"

[[bin]]
name = "jbot-analyze"
path = "src/main.rs"

[dependencies]

[[bin]]
name = "lever-fit"
path = "src/bin/lever_fit.rs"

[[bin]]
name = "recovery-sweep"
path = "src/bin/recovery_sweep.rs"

[[bin]]
name = "spin-fit"
path = "src/bin/spin_fit.rs"

[[bin]]
name = "command_path"
path = "src/bin/command_path.rs"

[[bin]]
name = "gain-sweep"
path = "src/bin/gain_sweep.rs"

[[bin]]
name = "hold-step-sweep"
path = "src/bin/hold_step_sweep.rs"

[[bin]]
name = "outer-sweep"
path = "src/bin/outer_sweep.rs"
