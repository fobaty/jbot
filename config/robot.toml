# JBOT-Wheeled Biped baseline model configuration.
#
# Status: stage 1 donor hardware. Values are estimates that must be replaced by
# CAD or bench measurement. The uncertainty is recorded next to each block; the
# validator rejects values that are non-physical or use an unsupported schema
# version.
#
# Stage 1 hardware: donor hoverboard STM32F103RCT6 mainboard, two direct-drive
# hub motors, 10s2p 36 V pack, BNO055 IMU, RadioMaster XR1 receiver paired with
# a BetaFPV LiteRadio 3 Pro transmitter. See docs/hardware.md.
#
# Stage 2 adds two hip actuators (model TBD) and the four-bar legs. The leg and
# hip blocks are the provisional stage 2 model, not present on the robot yet.

schema_version = 1

[mechanical]
# Source: donor mainboard, pack, frame, and electronics, excluding the wheels.
# Uncertainty: +/- 1.0 kg.
body_mass_kg = 5.0
# Source: uniform-body estimate about the wheel axle. Uncertainty: +/- 0.10.
body_pitch_inertia_kg_m2 = 0.30
# Source: donor hub motor with rim and tyre, weighed with the wheel fitted.
# Uncertainty: +/- 0.3 kg.
wheel_mass_kg = 2.3
# Source: 6.5 in wheel. Uncertainty: +/- 3 mm.
wheel_radius_m = 0.0825
# Source: solid-disc estimate 0.5 * m * r^2 plus hub inertia. Uncertainty: +/- 20%.
wheel_inertia_kg_m2 = 0.0078
# Source: donor axle between wheel centres. Uncertainty: +/- 20 mm.
track_width_m = 0.32
# Source: packaging sketch with the pack and electronics above the axle.
# Uncertainty: +/- 50 mm.
com_height_m = 0.25

[leg]
# Stage 2 only. Planar four-bar in the fore-aft/vertical leg plane.
# Source: preliminary linkage synthesis. Link lengths are provisional and must
# be confirmed against CAD and the bench. Uncertainty: +/- 5 mm per link.
base_m = 0.14
crank_m = 0.11
rocker_m = 0.13
coupler_m = 0.06
fork_de_m = 0.18
fork_ce_m = 0.17
# Assembly branch of the lower rocker and the rigid wheel fork.
rocker_branch = "negative"
fork_branch = "negative"
# Hip travel window that stays clear of the linkage toggle positions.
# Source: synthesis; limits are in hip-joint coordinates (rad).
hip_min_rad = -1.55
hip_max_rad = -0.70
# Source: placeholder for an integrated hip actuator gearbox. Uncertainty: +/- 1.
hip_gear_ratio = 10.0
# Optional spring between the base and the upper crank; zero means not fitted.
spring_stiffness_nm_per_rad = 0.0
spring_travel_rad = 0.0

[drive]
# Source: donor hub motor at the 10 A bench current limit, estimated at about
# 0.25 N*m/A. Measure on the bench before raising the limit. Uncertainty: +/- 20%.
max_wheel_torque_nm = 2.5
# Source: 400 rpm firmware speed limit = 41.9 rad/s, rounded down.
max_wheel_speed_rad_s = 40.0
max_wheel_accel_rad_s2 = 120.0

[hip]
# Stage 2 only. Placeholder until the hip actuator is selected. The current
# value is the class of actuator needed for a roughly 10 kg platform, not a vendor spec.
max_torque_nm = 17.0
max_speed_rad_s = 8.0

[control]
# Source: EFeru main loop period of 5 ms on the STM32F103.
balance_rate_hz = 200.0
# 30 degrees, inside the 25-35 degree requirement range.
tilt_limit_rad = 0.5235987755982988
# Source: radio link-loss budget.
command_timeout_ms = 100
